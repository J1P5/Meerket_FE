name: build test

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: .

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node modules
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-node-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Check cache status
        run: |
          if [ "${{ steps.yarn-cache.outputs.cache-hit }}" = "true" ]; then
            echo "캐시 히트: node_modules가 캐시에서 복원되었습니다."
          else
            echo "캐시 미스: 새로운 node_modules를 설치합니다."
          fi

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: |
          yarn build 2>&1 | tee build.log
          echo "BUILD_EXIT_CODE=$?" >> $GITHUB_ENV
        id: build

      - name: Check build status
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::빌드 테스트에 실패했습니다. 코드를 확인해주세요."
          echo "::group::빌드 에러 상세 내용"
          cat build.log
          echo "::endgroup::"
          exit 1

      - name: Comment PR
        if: steps.build.outcome != 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const errorMessage = fs.readFileSync('build.log', 'utf8');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ 빌드 테스트 실패\n\n빌드 테스트 중 다음과 같은 에러가 발생했습니다:\n\n\`\`\`\n${errorMessage}\n\`\`\`\n\n코드를 확인하고 수정해주세요.`
            })
